input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/vendor/jar/jdbc/ojdbc8.jar"
    jdbc_driver_class => "Java::oracle.jdbc.driver.OracleDriver"
    jdbc_connection_string => "jdbc:oracle:thin:@//oracle:1521/FREEPDB1"
    jdbc_user => "${APP_USER}"
    jdbc_password => "${APP_USER_PASSWORD}"
    statement => "SELECT id, name, updated_at FROM customers ORDER BY id"
    jdbc_fetch_size => 1000
    schedule => "* * * * *"
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "customers"
    document_id => "%{id}"
  }
  stdout { codec => rubydebug }
}
